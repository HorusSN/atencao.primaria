<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E1B2B">
  <meta name="description" content="Sistema Hórus de Informações da Atenção Primária à Saúde.">
  <title>Sistema Hórus de Informações da APS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>HÓRUS SERVIÇOS &amp; NEGÓCIOS</h1>
    <p>Sistema Hórus de Informações da APS</p>
  </header>

  <main>
    <section class="selector" aria-label="Seleção do município">
      <label for="municipio">Município</label>
      <div class="select-wrap">
        <select id="municipio">
          <option value="">Selecione o município</option>
          <option value="311210">Caparaó</option>
          <option value="312370">Engenheiro Caldas</option>
          <option value="312580">Fernandes Tourinho</option>
          <option value="520890">Goiás</option>
          <option value="315800">Santa Maria de Itabira</option>
          <option value="316020">Santo Antônio do Itambé</option>
          <option value="316294">São José da Barra</option>
        </select>
      </div>
    </section>

    <section class="topics" aria-label="Módulos do sistema">
      <button data-topic="Cobertura da APS" disabled>Cobertura da APS</button>
      <button data-topic="Credenciamento" disabled>Credenciamento</button>
      <button data-topic="Financiamento" disabled>Financiamento</button>
      <button data-topic="Cofinanciamento" disabled>Cofinanciamento</button>
      <button data-topic="Produção" disabled>Produção</button>
    </section>

    <section class="detail" id="detalhe" hidden>
      <h2 id="detail-title"></h2>
      <p id="detail-city"></p>
      <section class="period-filter" aria-label="Seleção do período">
        <fieldset class="period-types">
          <legend>Período</legend>
          <div class="period-options">
            <label><input type="radio" name="periodo-tipo" value="anual"><span>Anual</span></label>
            <label><input type="radio" name="periodo-tipo" value="quadrimestral"><span>Quadrimestral</span></label>
            <label><input type="radio" name="periodo-tipo" value="mensal"><span>Mensal</span></label>
          </div>
        </fieldset>

        <div class="period-value">
          <label for="periodo-valor">Referência</label>
          <div class="period-value-row">
            <div class="select-wrap">
              <select id="periodo-valor" disabled>
                <option value="">Selecione primeiro o período</option>
              </select>
            </div>
            <button class="back" id="voltar">Voltar</button>
          </div>
        </div>
      </section>
      <div class="empty-state" hidden>Área preparada para inclusão dos indicadores.</div>
      <section class="production-dashboard" id="production-dashboard" hidden aria-label="Indicadores de produção">
        <div id="production-indicators"></div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
